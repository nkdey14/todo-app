<p>Root App Component HTML</p>

<main>

      <app-user
        [id]="users[0].id.toString()"
        [avatar]="users[0].avatar"
        [name]="users[0].name"
        (select)="onSelectUser($event)"
      />

      <app-user

      <app-user
        [id]="users[2].id.toString()"

        (select)="onSelectUser($event)"
      />

      />
