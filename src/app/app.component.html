<app-header></app-header>
<!-- <p>Root App Component HTML</p> -->
<!-- step 2 where app.component.html using property binding will share data with user.component.ts -->
<main>
  <div class="content">
    <ul id="users">
      <ul>
        <app-user [user]="users[0]" (select)="onSelectUser($event)" />
      </ul>
      <ul>
        <app-user [user]="users[1]" (select)="onSelectUser($event)" />
      </ul>
      <ul>
        <app-user [user]="users[2]" (select)="onSelectUser($event)" />
      </ul>
      <ul>
        <app-user [user]="users[3]" (select)="onSelectUser($event)" />
      </ul>
    </ul>

    <div class="tasks">
      <h2><app-tasks [name]="selectedUser?.name"></app-tasks></h2>
    </div>
  </div>
</main>
