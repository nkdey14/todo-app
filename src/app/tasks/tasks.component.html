<div *ngIf="isAddingTask">
  <app-new-task (cancelTask)="cancelTask()" />
</div>

<div class="tasks">
  <header>
    {{ name }}'s Tasks
    <button (click)="addNewTask()">Add Task</button>
  </header>
</div>

<ul>
  <li *ngFor="let task of selectedUserTasks">
    <app-task [task]="task" (complete)="onCompleteTask($event)" />
  </li>
</ul>
